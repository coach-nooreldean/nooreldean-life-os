<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing outer circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="14 10" opacity="0.6"/>

  <!-- Compass / Target Lines -->
  <line x1="256" y1="40" x2="256" y2="80" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="432" x2="256" y2="472" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="256" x2="80" y2="256" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="432" y1="256" x2="472" y2="256" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Inner Glowing Shield / Crest -->
  <circle cx="256" cy="256" r="120" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Center Symbol: Stylized Monogram N & Lightning / Focus Arrow -->
  <path d="M 200 330 V 182 L 312 330 V 182" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Crown / Star of Excellence -->
  <polygon points="256,120 264,138 284,140 269,154 273,174 256,163 239,174 243,154 228,140 248,138" fill="url(#goldGrad)" filter="url(#glow)"/>
</svg>
